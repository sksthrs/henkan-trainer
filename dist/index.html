<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HenkanTrainer v0.3</title>
  <link href="main.css?0_3" rel="stylesheet">
  <meta name="description" content="HenkanTrainer - 入力＆変換練習ツール">
  <meta property="og:title" content="HenkanTrainer">
  <meta property="og:description" content="入力＆変換練習ツール">
  <meta property="og:image" content="apple-touch-icon.png">
  <!-- for apple devices... -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HenkanTrainer">
  <!-- end of 'for apple devices' -->
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app">
    <div id="tool" class="flex-fixed flex-h-center">
      <div id="remaining">
        <span>[残り</span><span id="remaining-time">00</span><span>秒</span><span>]</span>
      </div>
      <div>
        <span> [</span><span id="letters">0</span><span>文字 (最高</span><span id="max-letters">0</span><span>)]</span>
      </div>
      <div>
        <span> [</span><span id="num-phrases">0</span><span>回]</span>
      </div>
      <div>
        <span> [ミス</span><span id="typos">0</span><span>回]</span>
      </div>
      <button id="log-open">log</button>
    </div><!-- end of 'tool' -->
    <div id="exercise">
      <div id="phrase"></div>
      <div id="type">
        <form id="type-form" autocomplete="off" autocorrect="off" autocapitalize="none">
          <input type="text" id="type-input" name="typing-answer" autocomplete="off" autocorrect="off" autocapitalize="none" />
        </form>
      </div>
    </div>
    <div id="footer">(c) mekiku.com 2026-</div>
    <!-- 効果音ラボ（https://soundeffect-lab.info/）のサウンドを利用させていただいてます -->
  </div>
  <dialog id="opening">
    <div id="description">
      <div id="last-score">
        <h2>結果</h2>
        <p>
          正しく入力できた文字数　<span id="last-letters"></span>文字（最高記録 <span id="last-max-letters"></span>文字）
          <br>入力を完了できた問題数　<span id="last-phrases"></span>問
          <br><span id="last-typos-container" class="emphasize">ミス　<span id="last-typos"></span>回</span>
        </p>
        <p id="conguraturations" class="hide">新記録です！おめでとうございます！</p>
      </div>
      <div id="instruction">
        <h2>【入力＆変換練習ツール】</h2>
        <p>入力だけでなく変換や登録単語利用も含めた練習用です。</p>
        <ul>
          <li><span class="emphasize">エンターキー（"Enter"キー）を押すと開始</span>します</li>
          <li><span id="exercise-period"></span>分の間、短文を入力しては、もう一度エンターキーを押し、次の問題に進みます</li>
          <li><span class="shortcut">緑色で下線つきの部分</span>は登録単語の部分です。登録単語を活用して加速しましょう</li>
        </ul>
      </div>
      <div id="erase-container"><button id="erase-records">成績を初期化</button></div>
    </div>
  </dialog>
  <dialog id="log-dialog">
    <div id="log-content">
      <div id="log-text"></div>
      <button id="log-close">OK</button>
    </div>
  </dialog>
  <script type="module" src="index.js?0_3"></script>
</body>
</html>
